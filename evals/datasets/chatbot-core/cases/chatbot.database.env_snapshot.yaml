# 维度：Database（观测型断言，正向）——`file_state` + `database_state` 的真实接线。
#
# 这条 case 的判定对象不是 agent 说了什么，而是**环境变成了什么样**，且两个
# 观测面都落在同一个 iteration 里：
#
#   file_state ← filesystem provider 的 workdir 快照（<iterN>/workspace）
#   database_state ← sqlite provider 的 fixture.db 快照（<iterN>/fixture.db）
#
# 注意 database_state 与上一个 case 的区别：前者的库在**同一目录**（database:
# sqlite 时 handle.workdir 就是 iteration 根），所以用 sqlite provider 时
# file_state 与 database_state 可同时观测；而 agent 读 SQLite 仍走 bash。
# 本 case 的 prompt 完全不提数据库，只要求**不改动**已有文件——于是 database_state
# 的断言是"agent 没乱动库"（行数不变、没建 audit 表），file_state 的断言是
# "要写的写了、该在的还在、没让 agent 建的东西不存在"。
#
# 负向的那一半（missing.md 不存在）是 fixture 初态就成立的：它验证的是
# `file_state.absent` 不是恒假的装饰品——把一个真实存在的文件写进 absent 就会红，
# 而这条 case 里那个文件确实不存在，所以它是绿的；两者合起来说明该键可判。
id: chatbot.database.env_snapshot
version: 1
name: 环境终态快照断言（file_state / database_state 接线）
tags:
  - chatbot
  - database
  - golden
difficulty: medium

input:
  type: single_turn
  prompt: |
    请用 write_file 在当前工作目录创建 summary.md，内容为两行：
    第一行 `# 值班小结`，第二行 `状态：正常`。
    不要改动工作目录里已有的任何其他文件。

environment:
  fixture: chatbot_ops
  database: sqlite

execution:
  timeout: 120
  repeat: 2

expected:
  status: success
  tools:
    required:
      - write_file
  file_state:
    files:
      summary.md:
        exists: true
        contains:
          - "# 值班小结"
          - "状态：正常"
      fixture.db:
        exists: true
    absent:
      - missing.md
  database_state:
    tables:
      tickets:
        exists: true
        min_rows: 4
        max_rows: 4
    tables_absent:
      - audit_log

evaluation_profile: chatbot-plain
