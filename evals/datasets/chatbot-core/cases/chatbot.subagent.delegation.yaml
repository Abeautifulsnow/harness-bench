# 维度：Tool（子代理路由）——`subagent.started` 事件与 `harness.subagent_routing`。
#
# 判定对象是"把子任务交给了谁"，不是"交得好不好"（后者是语义判断，留给 judge，
# 见 SubAgentRoutingEvaluator 的注释）。
#
# `subagent.started` 的 name 来自 `data-sub-open.agentType`，而它由**模型填不填
# `agentType` 参数**决定（平台侧是 `agentType ?? 'auto'`，agent-tool.ts:335）。
# 首版提示词没钉死 agentType，第二轮 C 类全量跑里同一条 case 两次运行给出了不同的
# name（iter1 `fullstack-engineer` / iter2 `auto`），failure_category=
# `harness.subagent_routing`——一次**用例自身的非确定性**被记成了路由错误。
#
# 第九轮实测（tmp/probe-async/probe_subagent_name.py，同提示词重复采样）：
#   不指定 agentType：9 次里 6 次 `auto`、3 次 `fullstack-engineer`（两个取值都出现）
#   显式要求 general-purpose：8 次全为 `general-purpose`（唯一取值）
# 因此提示词改成**显式指定**，expected 取那个被指定的值。
#
# 这条改动不是在把断言改宽——反而收紧了：原先靠 `allow_extra: true` 兜住"顺手起了
# 别的代理"，现在观测集合必须恰好等于被指定的那一个（集合去重，同类型委托两次仍算
# 命中）。被钉住的是**模型的自由度**，不是平台事实；"subagent.started 被观测到、
# name 与请求一致"这件事仍然可红（平台不发事件、或归一化错名字，都会判 FAIL）。
id: chatbot.subagent.delegation
version: 1
name: 子代理委托与路由（Tool 正向）
tags:
  - chatbot
  - tool-use
  - subagent
  - golden
difficulty: medium

input:
  type: single_turn
  prompt: |
    请用 agent 工具把这件事委托给一个子代理，并且**必须在 agentType 参数里显式写
    `general-purpose`**：让它统计当前工作目录里 handbook.md 的字符数。

environment:
  fixture: chatbot_workspace
  database: filesystem

execution:
  timeout: 240
  repeat: 2

expected:
  status: success
  output:
    contains:
      - "handbook.md"
  tools:
    required:
      - agent
  constraints:
    max_tool_calls: 6
  file_state:
    absent:
      - notes.txt

# strict 档：本 case 的路由断言落在 harness.subagent_routing 上，而 plain 档里
# harness.* 一律 blocking=false——那会让这条 golden 变成"路由错了也照样绿"，
# 与它存在的理由（证明 subagent.started 被观测到且名字对得上）直接矛盾。
evaluation_profile: chatbot-strict

metric_params:
  harness.subagent_routing:
    expected:
      - general-purpose
