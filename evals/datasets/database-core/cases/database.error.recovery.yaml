# 负向用例：mock/fake agent 上报 error 事件 → run 状态非 success → 阻断。
# regression suite 需要"该红的能红"的成员，故一并打上 regression 标签。
id: database.error.recovery
version: 1
name: Agent 错误上报（负向）
tags:
  - database
  - core
  - regression
  - negative
difficulty: medium

input:
  type: single_turn
  prompt: |
    [fail] 这条查询会触发 agent 内部错误。

execution:
  timeout: 15
  repeat: 1

expected:
  status: success
  output:
    contains:
      - "QUERY COMPLETE"

evaluation_profile: smoke
