# Nightly（评估 2026-10-09：PR Gate speed-first 之外的第二条常态化评测线）。
#
# 与 evals/schedules/nightly-database-core.yaml 的本地调度语义对齐（03:00 本地
# 时间 = UTC 19:00），但跑在 CI 上：repeat=3 让 stability / pass@k / pass^k
# 真正产出数据，而不是 PR 冒烟的 repeat=1。
#
# 报告产物保留 30 天，作为 release baseline pin 的候选来源（release workflow
# 的 baseline_run 输入填的就是这些 run 的 id）。

name: nightly

on:
  schedule:
    - cron: "0 19 * * *" # UTC 19:00 = 本地（UTC+8）03:00
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync

      - uses: actions/cache/restore@v4
        with:
          path: .agent-eval
          key: eval-data-main-v1-${{ github.run_number }}
          restore-keys: eval-data-main-v1-

      # 选择 smoke 标签（与 evals/schedules/nightly-database-core.yaml 的
      # preset 同一意图）：core 等宽组合里含有 fake agent 下按设计恒红的
      # 负向/红队 canary（"负向用例必须真的红"），放进常态化 CI 只会制造噪音。
      # repeat=3 让 stability / pass@k / pass^k 每晚真实产出。
      - name: Smoke suite, repeat=3, main gate
        run: |
          uv run agent-eval benchmark run database-core \
            --tag smoke --repeat 3 --agent fake:// --no-judge \
            --gate main --run-id-file run.id
          uv run agent-eval gate "$(cat run.id)" --gate main

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-reports-${{ github.run_number }}
          path: |
            .agent-eval/runs/*/report.json
            .agent-eval/runs/*/report.html
          retention-days: 30
          if-no-files-found: warn

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .agent-eval
          key: eval-data-main-v1-${{ github.run_number }}
